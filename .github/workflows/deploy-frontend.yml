name: Frontend CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing VPS_SSH_PRIVATE_KEY secret}"

          port="${VPS_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload build to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"

          port="${VPS_SSH_PORT:-22}"
          incoming="/tmp/bybit-payer-frontend-${GITHUB_SHA}"

          ssh -i ~/.ssh/deploy_key -p "$port" "$VPS_USER@$VPS_HOST" \
            "rm -rf '$incoming' && mkdir -p '$incoming'"
          scp -i ~/.ssh/deploy_key -P "$port" -r dist/. "${VPS_USER}@${VPS_HOST}:${incoming}/"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          FRONTEND_SITE_DIR: ${{ vars.FRONTEND_SITE_DIR }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"

          port="${VPS_SSH_PORT:-22}"
          incoming="/tmp/bybit-payer-frontend-${GITHUB_SHA}"
          site_dir="${FRONTEND_SITE_DIR:-/var/www/bybit-payer}"

          ssh -i ~/.ssh/deploy_key -p "$port" "$VPS_USER@$VPS_HOST" \
            "sudo bash -se -- '$incoming' '$site_dir'" <<'REMOTE_SCRIPT'
          incoming="$1"
          current="$2"
          release="${current}.release"
          backup="${current}.previous"

          set -euo pipefail

          rollback() {
            if [ ! -d "$current" ] && [ -d "$backup" ]; then
              mv "$backup" "$current"
            fi
          }
          trap rollback EXIT

          test -d "$incoming"
          test -f "$incoming/index.html"

          rm -rf "$release"
          install -d -m 0755 "$release"
          cp -a "$incoming"/. "$release"/
          chown -R root:root "$release"
          find "$release" -type d -exec chmod 0755 {} +
          find "$release" -type f -exec chmod 0644 {} +

          rm -rf "$backup"
          if [ -d "$current" ]; then
            mv "$current" "$backup"
          fi
          mv "$release" "$current"
          rm -rf "$incoming"

          trap - EXIT
          REMOTE_SCRIPT

      - name: Verify deployed files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
          FRONTEND_SITE_DIR: ${{ vars.FRONTEND_SITE_DIR }}
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_USER:?Missing VPS_USER secret}"

          port="${VPS_SSH_PORT:-22}"
          site_dir="${FRONTEND_SITE_DIR:-/var/www/bybit-payer}"

          ssh -i ~/.ssh/deploy_key -p "$port" "$VPS_USER@$VPS_HOST" \
            "test -f '$site_dir/index.html'"

          if [ -n "${FRONTEND_PUBLIC_URL:-}" ]; then
            curl --fail --silent --show-error --head "$FRONTEND_PUBLIC_URL"
          fi
